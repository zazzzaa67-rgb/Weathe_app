<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Weather App</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <h1>Weather App</h1>
            <h2>for weather forecasts</h2>
            <!-- <img class="main-photo" src="photos/warm.jpg" alt="cloudy and nice sky"> -->
            <label for="user_area"><strong>City</strong></label><br>
            
            <input id="user_area" class="the_area" type="text" placeholder="Please Enter your City" alt="an cloudy photo ">
            <button class="Enter">Enter</button>
        </header>
        <main class="Main-part">
            <section class="recent-weather">
                <h3>the area is : </h3>
                <img src="" alt="this is an amazing area photo ">
                <div class="the-temperature">The temperature is : </div>
                <div class="tommorrow-forecast">Tomorrow forecast is : </div>

            </section>
            <ul class="week-forecast">
                <li class="day">Saturday</li>
                <li class="day" >Sunday</li>
                <li class="day" >Monday</li>
                <li class="day" >Tuesday</li>
                <li class="day">Wednesday</li>
                <li class="day">thursday</li>
                <li class="day">friday</li>
            </ul>
            <section class="the_status">
            </section>
            <fieldset>
                <legend>Do you have any forecast</legend>
                <input type="radio" id="yes">
                <label for="yes">Yes</label><br>
                <input type="radio" id="no">
                <label for="no">NO</label>
            </fieldset>
                
        </main>
        
    </body>
</html>
