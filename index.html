<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Weather App</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
            <h1>Weather App</h1>
            <h2>for weather forecasts</h2>
            <img class="main-photo" src="photos/warm.jpg" alt="cloudy and nice sky">
            <label for="user_area">City</label>
            <input id="user_area" class="the_area" type="text" placeholder="Please Enter your City">
        </header>
        <section class="Main-part">
            <section class="recent-weather">
                <h3>the area is : </h3>
                <img src="" alt="this is an amazing area photo ">
                <div class="the-temperature">The temperature is : </div>
                <div class="tommorrow-forecast">Tomorrow forecast is : </div>

            </section>
            <section class="week-forecast">
                <div class="day" >Saturday</div>
                <div class="day" >Sunday</div>
                <div class="day" >Monday</div>
                <div class="day" >Tuesday</div>
                <div class="day" >wednesday </div>
                <div class="day" >Thursday</div> </div>
            </section>
            <section class="the_status">
                <!--I can add any News here about the weather or the clothe-->
            </section>
            <fieldset>
                <legend>Do you have any forecasts</legend>
                <input type="radio" id="yes" >
                <label for="yes" >Yes</label><br>
                <input type="radio" id="no">
                <label for="no">NO</label>
            </fieldset>
                
        </section>
        
    </body>
</html>
